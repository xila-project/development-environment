# Build and publish the canonical Xila development image to GHCR.
#
# Publish native amd64 and arm64 development images.
name: Publish development image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege by default; the publish job opts into `packages: write`.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate on every trigger: no image build here.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run xila-dev wrapper tests
        run: bash scripts/tests/xila-dev.test.sh

      - name: Lint the Dockerfile with BuildKit
        run: docker build --check .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # The image is large and hosted runner root disks are tight.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi
          docker image prune --all --force
          df -h /

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xila-project/core-dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=false,suffix=-${{ matrix.arch }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pull requests build without publishing, and load the image so it can
          # be smoke-tested locally in the runner. `load: true` cannot carry
          # attestations, so provenance/SBOM are only enabled when pushing.
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=core-dev-${{ matrix.arch }}
          cache-to: type=gha,scope=core-dev-${{ matrix.arch }},mode=max

      # PR builds load and smoke-test natively on each runner architecture.
      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          set -a && . ./toolchains.env && set +a
          image="$IMAGE_ID"
          echo "Smoke-testing $image"
          docker run --rm "$image" clang --version
          docker run --rm "$image" rustc --version
          docker run --rm "$image" cargo --version
          docker run --rm "$image" node --version
          docker run --rm "$image" cargo make --version
          docker run --rm "$image" taplo --version
          docker run --rm "$image" sccache --version
          docker run --rm "$image" cargo llvm-cov --version
          docker run --rm -e LLVM_VERSION="$LLVM_VERSION" "$image" bash -lc 'clang --version | grep -F "$LLVM_VERSION"'
          docker run --rm "$image" bash -lc 'test -e "$LIBCLANG_PATH/libclang.so"'

  manifest:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xila-project/core-dev
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Publish multi-platform manifests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            name="${tag##*:}"
            docker buildx imagetools create \
              --tag "$tag" \
              "ghcr.io/xila-project/core-dev:${name}-amd64" \
              "ghcr.io/xila-project/core-dev:${name}-arm64"
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
